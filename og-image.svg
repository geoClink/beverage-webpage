  <!-- Decorative circle (right side accent) -->
  <circle cx="1060" cy="315" r="140" stroke="#2d5a27" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="1060" cy="315" r="110" stroke="#2d5a27" stroke-width="0.75" fill="none" opacity="0.4"/>
  <circle cx="1060" cy="315" r="4" fill="#d4e8cb" opacity="0.8"/>
  <!-- Cross through circle -->
  <line x1="1060" y1="175" x2="1060" y2="455" stroke="#2d5a27" stroke-width="1" opacity="0.5"/>
  <line x1="920" y1="315" x2="1200" y2="315" stroke="#2d5a27" stroke-width="1" opacity="0.5"/>

  <!-- Small plus marks scattered -->
  <text x="950" y="175" font-family="monospace" font-size="14" fill="#4a5c48" opacity="0.6">+</text>
  <text x="1150" y="155" font-family="monospace" font-size="14" fill="#4a5c48" opacity="0.6">+</text>
  <text x="970" y="480" font-family="monospace" font-size="14" fill="#4a5c48" opacity="0.6">+</text>
  <text x="1140" y="490" font-family="monospace" font-size="14" fill="#4a5c48" opacity="0.6">+</text>

</svg>
