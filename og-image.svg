  <!-- Divider rule between headline and footer -->
  <line x1="108" y1="452" x2="820" y2="452" stroke="#4a5c48" stroke-width="1"/>

  <!-- Tagline -->
  <text
    x="108"
    y="498"
    font-family="'Courier New', 'Space Mono', monospace"
    font-size="16"
    font-weight="400"
    letter-spacing="2"
    fill="#faf8f5"
